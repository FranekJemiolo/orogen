name: Orogen CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Protocol Core
        run: npm run build
